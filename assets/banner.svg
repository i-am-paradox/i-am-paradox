<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>

    <!-- Refined Jewel Neon Accents -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="subtleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0"/>
      <stop offset="30%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Lighting -->
    <radialGradient id="ambientCenter" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#070A10" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1E293B" fill-opacity="0.6"/>
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .pulse-dot { animation: pulseLive 2.5s ease-in-out infinite; transform-origin: 500px 36px; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, sans-serif; }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="280" rx="14" fill="url(#bgCanvas)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Tech Dot Grid Overlay -->
  <rect width="1000" height="280" rx="14" fill="url(#dotGrid)"/>
  <rect width="1000" height="280" rx="14" fill="url(#ambientCenter)"/>

  <!-- Top Status Pill -->
  <g transform="translate(340, 24)">
    <rect x="0" y="0" width="320" height="24" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="12" r="3.5" fill="#10B981" class="pulse-dot"/>
    <text x="28" y="15.5" class="mono" font-size="10" font-weight="600" fill="#94A3B8" letter-spacing="1">
      STATUS: <tspan fill="#F8FAFC">ACTIVE RESEARCH &amp; PRODUCTION</tspan>
    </text>
  </g>

  <!-- Clean Subtle Framing Accents -->
  <path d="M 28 40 L 28 24 L 44 24" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M 972 40 L 972 24 L 956 24" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M 28 240 L 28 256 L 44 256" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M 972 240 L 972 256 L 956 256" stroke="#334155" stroke-width="1.5" fill="none"/>

  <!-- Top Corner Telemetry -->
  <text x="44" y="38" class="mono" font-size="10.5" fill="#64748B" letter-spacing="0.5">
    RESEARCH PROTOCOL // <tspan fill="#94A3B8">0x50415241444F58</tspan>
  </text>
  <text x="956" y="38" class="mono" font-size="10.5" fill="#64748B" letter-spacing="0.5" text-anchor="end">
    INDIA // <tspan fill="#94A3B8">UTC +05:30</tspan>
  </text>

  <!-- Accent Divider Line -->
  <line x1="120" y1="58" x2="880" y2="58" stroke="url(#subtleLine)" stroke-width="1"/>

  <!-- Main Hero Brand Name -->
  <g filter="url(#textGlow)">
    <text x="500" y="142" text-anchor="middle" class="sans" font-weight="900" font-size="54" letter-spacing="8" fill="url(#brandGradient)">
      PARADOX
    </text>
  </g>
  <text x="500" y="142" text-anchor="middle" class="sans" font-weight="900" font-size="54" letter-spacing="8" fill="#F8FAFC">
    PARADOX
  </text>

  <!-- Professional Subtitle -->
  <text x="500" y="180" text-anchor="middle" class="sans" font-size="13.5" font-weight="600" fill="#94A3B8" letter-spacing="3.5">
    SECURITY RESEARCHER <tspan fill="#10B981">•</tspan> SYSTEMS ARCHITECT <tspan fill="#06B6D4">•</tspan> APPLIED MATHEMATICIAN
  </text>

  <!-- Core Research Motto -->
  <text x="500" y="206" text-anchor="middle" class="mono" font-size="11" fill="#64748B" letter-spacing="1">
    Formal verification of vulnerability invariants · Low-latency memory-safe engineering
  </text>

  <!-- Bottom Divider Line -->
  <line x1="120" y1="226" x2="880" y2="226" stroke="url(#subtleLine)" stroke-width="1"/>

  <!-- Bottom Engineering Pillars -->
  <g class="mono" font-size="10" fill="#64748B" letter-spacing="1">
    <text x="44" y="248">
      CORE: <tspan fill="#F8FAFC">RUST · C++ · PYTHON · GO · FLUTTER</tspan>
    </text>
    <text x="500" y="248" text-anchor="middle">
      FOCUS: <tspan fill="#10B981">OFFSEC AUDITS</tspan> | <tspan fill="#06B6D4">CONCURRENCY</tspan> | <tspan fill="#3B82F6">CRYPTO</tspan>
    </text>
    <text x="956" y="248" text-anchor="end">
      POLICY: <tspan fill="#F8FAFC">COORDINATED DISCLOSURE</tspan>
    </text>
  </g>
</svg>
