<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="100%" height="100%">
  <defs>
    <!-- Background Velvet Deep Palette -->
    <linearGradient id="bgVelvet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>

    <!-- Aurora Lights Gradients -->
    <radialGradient id="auroraEmerald" cx="25%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080D1A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraCyan" cx="75%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080D1A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auroraViolet" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#080D1A" stop-opacity="0"/>
    </radialGradient>

    <!-- Refined Text Gradient (Soft Silver to Pearl Cyan) -->
    <linearGradient id="titleShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#99F6E4"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Subtle Calming Line Divider -->
    <linearGradient id="softDivider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Ambient Blur -->
    <filter id="gentleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes gentlePulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.45; }
    }
    .zen-pulse { animation: gentlePulse 3.5s ease-in-out infinite; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, monospace; }
  </style>

  <!-- Canvas Container with Soft Border -->
  <rect width="1000" height="290" rx="18" fill="url(#bgVelvet)" stroke="#1E293B" stroke-width="1"/>

  <!-- Soothing Ambient Auroras -->
  <rect width="1000" height="290" rx="18" fill="url(#auroraEmerald)"/>
  <rect width="1000" height="290" rx="18" fill="url(#auroraCyan)"/>
  <rect width="1000" height="290" rx="18" fill="url(#auroraViolet)"/>

  <!-- Elegant Status Pill -->
  <g transform="translate(365, 26)">
    <rect x="0" y="0" width="270" height="26" rx="13" fill="#0F172A" fill-opacity="0.75" stroke="#334155" stroke-width="0.8"/>
    <circle cx="16" cy="13" r="3.5" fill="#34D399" class="zen-pulse"/>
    <text x="28" y="17" class="font-sans" font-size="10.5" font-weight="500" fill="#94A3B8" letter-spacing="1.2">
      EXPLORING, PROVING &amp; CRAFTING
    </text>
  </g>

  <!-- Ambient Top Subtle Divider -->
  <line x1="140" y1="64" x2="860" y2="64" stroke="url(#softDivider)" stroke-width="1"/>

  <!-- Mathematical Invariant Monogram (Subtle Watermark in Background) -->
  <text x="500" y="105" text-anchor="middle" class="font-mono" font-size="12" fill="#475569" fill-opacity="0.5" letter-spacing="2">
    e^{i\pi} + 1 = 0  ·  \mathbb{P}(\text{truth}) = 1
  </text>

  <!-- Main Hero Brand Title: PARADOX -->
  <g filter="url(#gentleGlow)">
    <text x="500" y="162" text-anchor="middle" class="font-sans" font-weight="800" font-size="52" letter-spacing="10" fill="url(#titleShine)">
      PARADOX
    </text>
  </g>

  <!-- Refined Calming Subhead -->
  <text x="500" y="198" text-anchor="middle" class="font-sans" font-size="14" font-weight="500" fill="#CBD5E1" letter-spacing="3">
    MATHEMATICS <tspan fill="#34D399">•</tspan> SECURITY RESEARCH <tspan fill="#38BDF8">•</tspan> SYSTEMS CRAFT
  </text>

  <!-- Gentle Philosophy -->
  <text x="500" y="224" text-anchor="middle" class="font-sans" font-size="12" fill="#64748B" letter-spacing="0.8">
    "Simplicity is the prerequisite for reliability. Clarity is the foundation of security."
  </text>

  <!-- Ambient Bottom Divider -->
  <line x1="140" y1="244" x2="860" y2="244" stroke="url(#softDivider)" stroke-width="1"/>

  <!-- Clean Minimalist Footer Telemetry -->
  <g class="font-mono" font-size="10" fill="#64748B" letter-spacing="1">
    <text x="48" y="266">
      FOUNDATION: <tspan fill="#94A3B8">RUST · C++ · PYTHON · GO</tspan>
    </text>
    <text x="500" y="266" text-anchor="middle">
      <tspan fill="#34D399">RESPONSIBLE DISCLOSURE</tspan> · <tspan fill="#38BDF8">OPEN SOURCE</tspan>
    </text>
    <text x="952" y="266" text-anchor="end">
      LOCATION: <tspan fill="#94A3B8">INDIA</tspan>
    </text>
  </g>
</svg>
